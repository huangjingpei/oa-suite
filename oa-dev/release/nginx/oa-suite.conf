server {
    listen 80;
    server_name localhost; # 替换为您企业的域名或服务器公网 IP

    # 前端编译后的 dist 目录绝对路径 (如 /opt/oa-suite/dist 或宝塔站点根目录)
    root /opt/oa-suite/dist;
    index index.html;

    # 客户端上传单据附件最大尺寸限制 (50MB)
    client_max_body_size 50m;

    # HTML5 History 路由模式重定向 (防止刷新页面 404)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 移动端专版路径映射
    location /m/ {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长期缓存优化
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # 后端 RESTful API 统一反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
