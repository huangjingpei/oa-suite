version: '3.8'

services:
  # ==========================================
  # 1. MySQL 8.0 数据库底座服务
  # ==========================================
  oa-mysql:
    image: mysql:8.0.36
    container_name: oa-mysql
    restart: always
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --lower_case_table_names=1
      - --explicit_defaults_for_timestamp=true
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oa_suite
      MYSQL_USER: oa_user
      MYSQL_PASSWORD: oa_password
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行基准 DDL 与预置种子数据
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../sql/seed-data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    ports:
      - "3306:3306"
    networks:
      - oa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Spring Boot 3 业务后端服务
  # ==========================================
  oa-backend:
    build:
      context: ../oa-backend
      dockerfile: Dockerfile
    container_name: oa-backend
    restart: always
    depends_on:
      oa-mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://oa-mysql:3306/oa_suite?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      TZ: Asia/Shanghai
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    ports:
      - "8080:8080"
    networks:
      - oa-network

  # ==========================================
  # 3. Vue 3 + Nginx 前端静态托管与网关
  # ==========================================
  oa-frontend:
    image: nginx:1.25-alpine
    container_name: oa-frontend
    restart: always
    depends_on:
      - oa-backend
    volumes:
      - ../oa-frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    networks:
      - oa-network

volumes:
  mysql-data:
    driver: local
  backend-logs:
    driver: local
  backend-uploads:
    driver: local

networks:
  oa-network:
    driver: bridge
